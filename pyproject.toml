[project]
name = "hnet"
version = "0.0.1"
description = "H-Net"
authors = [
    { name = "Sukjun Hwang", email = "sukjunh@cs.cmu.edu" },
    { name = "Brandon Wang", email = "brandon.wang@cartesia.ai"},
    { name = "Albert Gu", email = "agu@cs.cmu.edu" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.1",
    "triton>=3.2.0",
    "mamba_ssm",
    "einops",
    "optree",
    "regex",
    "omegaconf",
]
[project.urls]
Repository = "https://github.com/goombalab/hnet"

[project.optional-dependencies]
build = [
    "flash-attn==2.8.1",
    "causal-conv1d==1.5.2",
]
[tool.uv]
no-build-isolation-package = ["flash-attn", "causal-conv1d"]
[tool.uv.sources]
mamba-ssm = { git = "https://github.com/main-horse/mamba", rev = "tc" }
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.1"
requires-dist = ["torch"]



[tool.setuptools.packages.find]
where = ["."]
include = ["hnet*"]
exclude = ["tests*"]

[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
    "torch",
    "packaging",
    "ninja",
]
build-backend = "setuptools.build_meta"
